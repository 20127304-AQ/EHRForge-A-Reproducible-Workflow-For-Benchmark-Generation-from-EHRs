[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehrforge-experiment-repro"
version = "1.1.0"
description = "Reproduction package for EHRForge retrieval and QA experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "modal>=1.1,<2",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["ehrforge_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
