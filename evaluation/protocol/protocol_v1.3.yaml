  nondeterminism_note: 'vLLM greedy (temperature 0) outputs are NOT guaranteed bit-identical across batch compositions: continuous batching / chunked prefill change
    kernel shapes and floating-point reduction order, which can flip near-tied argmax tokens. The fixed batching policy, fixed submission order and fixed chunking
    above minimise but do not eliminate this; small output differences vs a re-run with a different batch composition are expected and are not protocol deviations.'
