    snippet_normalized_match_pct: 99.47
search_spaces:
  list:
  - full_timeline
  - sampled_window
  full_timeline: all visits of the patient; candidate count N = len(visits)
  sampled_window:
    definition: visits of the QA's timeline_sampling_strategy window; reference implementation shared/canonical/sampled_window.py
    rules:
      local_chunk_{a}_{b}_size_{s}_overlap_{o}: range(a, min(b, V))
      '[global_]u_shape_first_{f}_last_{l}': range(f) + range(V-l, V); all visits if f+l >= V
      full_timeline_{lo}_{hi}: range(V)
    ranking: 'v1.1: bm25 builds its OWN rank_bm25.BM25Okapi index (and therefore its own IDF) over ONLY the window visits window(timeline_sampling_strategy, V) from shared/canonical/sampled_window.py, one cached index per (person_id, timeline_sampling_strategy); medcpt and nvembed_v2 = full_timeline scores restricted to window candidates, order preserved (exact: dense query-document scores do not depend on other documents); hybrid_rrf60@sampled_window recomputed from the sampled_window bm25 and medcpt ranks (1-based within the window). Ranked ids stay in full-timeline (original_visit_index) space.'
    step0_validation: 24141/24141 gold original_visit_index inside window and position == visit_index
    window_size:
      count: 10742.0
      mean: 28.4
      std: 5.0
      min: 2.0
      25%: 30.0
      50%: 30.0
      75%: 30.0
      max: 30.0
retrievers:
  document_unit: one visit (visit text only; datetime not included in the document)
  query: question text
  tie_break: score descending, then visit index ascending (stable)
  output: FULL ranking of all N candidates with scores, stored per (person_id, qa_index) in full-timeline indices
  bm25:
    impl: rank_bm25.BM25Okapi
    params:
      k1: 1.5
      b: 0.75
      epsilon: 0.25
    index: one BM25Okapi per patient over all visits of that patient
    index_sampled_window: 'v1.1: one BM25Okapi per (person_id, timeline_sampling_strategy) over ONLY the window visits (own IDF); see search_spaces.sampled_window.ranking'
    tokenizer: 'lambda s: re.sub(r''[^\w\s]'', '' '', s.lower()).split()'
    tokenizer_note: 'v1.1: lowercase (str.lower), then every char matching Python re [^\w\s] (Unicode-aware) -> one space, then str.split() with no args. Applied identically to queries and documents (index and query side). Reference implementation shared/canonical/ehr_data.py:bm25_tokenize. v1.0 used s.lower().split() (no punctuation stripping).'
  medcpt:
    query_encoder:
      repo: ncbi/MedCPT-Query-Encoder
      sha: d83a36cc6b8e3a5c5e9d9d6ba156808c1643dcbc
      max_length: 64
    article_encoder:
      repo: ncbi/MedCPT-Article-Encoder
      sha: d05a736da4bb84ee4057b7f7999485be6ed85465
      max_length: 512
      input: '[['''', visit_text]] (empty title)'
    pooling: CLS (last_hidden_state[:,0])
    similarity: dot product
    truncation: log number of truncated visits
  nvembed_v2:
    repo: nvidia/NV-Embed-v2
    sha: 3fa59658547db50a1e8e3346cf057fd0c77ed6ef
    query_instruction: 'Instruct: Given a clinical question, retrieve patient visit notes that answer the question

      Query: '
    passage_instruction: ''
    max_length: 4096
    normalize: true
    similarity: cosine
    trust_remote_code: true
    runtime_image: 'v1.1: OWN Modal image (debian_slim python 3.11; uv pip install torch==2.2.0 ''numpy<2'' transformers==4.42.4 sentence-transformers==2.7.0 datasets==2.20.0 ''pyarrow<17'' einops accelerate ...); NOT the main image'
    transformers_pin: 4.42.4
    encode: 'official model.encode(texts, instruction=<query_instruction or ''''>, max_length=4096) with its native latent-attention pooling (LatentAttentionModel); then torch.nn.functional.normalize(p=2, dim=1); score = cosine = dot of L2-normalised vectors'
    fallback: 'NEVER fall back to another model (e.g. e5); fail loudly (raise) instead'
    image_versions: {python: '3.11.12', torch: '2.2.0', transformers: '4.42.4', sentence-transformers: '2.7.0', tokenizers: '0.19.1', numpy: '1.26.4', datasets: '2.20.0', pyarrow: '16.1.0', accelerate: '1.15.0', einops: '0.8.2', rank-bm25: 'NOT_INSTALLED (PackageNotFoundError)'}
  hybrid_rrf60:
    inputs:
    - bm25
    - medcpt
    k: 60
    depth: FULL rankings (all N candidates)
    score: sum_r 1/(60 + rank_r(d)), rank 1-based
    tie_break: min(rank_bm25, rank_medcpt) ascending, then visit index ascending
    rebuild: 'hybrid_rrf60 is rebuilt from the NEW full-depth BM25 and MedCPT rankings produced under protocol 1.1, for the same search_space, referenced by file path + sha256 in the run metadata and in each header''s inputs_source field.'
    forbidden_inputs: 'retrieval_results_p2_top20.json and every file under archive/pre_fix/ are FORBIDDEN as inputs.'
