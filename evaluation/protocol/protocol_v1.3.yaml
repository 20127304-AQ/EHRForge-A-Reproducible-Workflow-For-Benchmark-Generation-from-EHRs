    condition context>, question=<question>)}]; text = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True) with the HF tokenizer at
    the pinned revision; prompt_token_ids = tokenizer.encode(text, add_special_tokens=False)'
  postprocessing: outputs[0].text.strip() only; no sentence trimming
  revision_check: model and tokenizer loaded with revision=<pinned sha> (LLM(model=repo, revision=sha, tokenizer=repo, tokenizer_revision=sha)); resolved commit read
