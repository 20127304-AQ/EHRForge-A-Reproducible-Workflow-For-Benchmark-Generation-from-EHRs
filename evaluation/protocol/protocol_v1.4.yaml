generative_engine:
  engine: vllm
  vllm_version: 0.28.0
  image:
    definition: modal.Image.from_registry('vllm/vllm-openai:v0.28.0@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635', setup_dockerfile_commands=['RUN
      ... ln -s $(which python3) /usr/bin/python']).entrypoint([]).run_commands('python3 -m pip install pyarrow==25.0.1 pandas==3.0.6 pyyaml==6.0.3 requests') + env/code
      mounts; source agent_step3_canonical_readers_v1_3_25_runs_3259c3b5_workdir/code/images.py (vllm_image). The added packages are I/O only; pip freeze before/after
      shows only pandas/pyarrow added, nothing replaced.
    base_image_tag: vllm/vllm-openai:v0.28.0
    base_image_index_digest: sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
    base_image_amd64_digest: sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635
    os: Ubuntu 24.04.3 LTS
    python: 3.12.3
    cuda: 13.0.2 (container CUDA_VERSION); torch.version.cuda 13.0
    torch: 2.13.0+cu130
    vllm: 0.28.0
    transformers: 5.15.1
    tokenizers: 0.22.2
    flashinfer-python: 0.6.16.post3
    triton: 3.7.1
    huggingface_hub: 1.28.0
    nvidia_driver_observed: 580.95.05
    versions_recorded_by: agent_step3_canonical_readers_v1_3_25_runs_3259c3b5_workdir/code/probe_images.py -> agent_step3_canonical_readers_v1_3_25_runs_3259c3b5_workdir/results/image_probe.json;
      re-recorded in every run's metadata
  dtype: bfloat16
  max_model_len: 8192
  sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 256
    seed: 42
    n: 1
  enable_prefix_caching: false
  speculative_decoding: none (no speculative_config)
  other_fixed_engine_args:
    enable_chunked_prefill: true
    enforce_eager: false
    seed: 42
    kv_cache_dtype: auto
    trust_remote_code: false
    load_format: safetensors (default auto)
    quantization: null
  batching_policy:
    rule: 'FIXED per model for all 5 conditions: tensor_parallel_size, max_num_seqs, max_num_batched_tokens, gpu_memory_utilization, GPU type and count. A value that
      must change for memory reasons is decided ONCE in the pilot and written here before the full run; never changed between conditions. The LLM object is built
      once per model and all 5 conditions run through it (or rebuilt with a byte-identical config); an engine-config hash is logged per condition and asserted equal.'
    qwen2_5_7b:
      gpu_type: H100 (Modal 'H100!' = no automatic upgrade to H200)
      gpu_count: 1
      tensor_parallel_size: 1
      max_num_seqs: 128
      max_num_batched_tokens: 8192
      gpu_memory_utilization: 0.9
    qwen2_5_32b:
      gpu_type: H100 (Modal 'H100!' = no automatic upgrade to H200)
      gpu_count: 2
      tensor_parallel_size: 2
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      gpu_memory_utilization: 0.9
    pilot_decision: proposed values; confirmed or changed ONCE by the pilot (see changelog_v1_3.pilot_decision)
  submission:
    order: all 10,742 prompts of a condition sorted by (person_id, qa_index) ascending
    chunk_size: 1024
    call: llm.generate(list_of_TokensPrompt(prompt_token_ids), sampling_params, use_tqdm=False) per chunk of 1,024 consecutive prompts (last chunk 10,742 - 10*1,024
      = 502); identical chunking for every condition
    condition_order:
    - bm25@full_timeline
    - medcpt@full_timeline
    - nvembed_v2@full_timeline
    - hybrid_rrf60@full_timeline
    - oracle
  prompt: 'messages=[{role: system, content: readers.generative.system_prompt}, {role: user, content: readers.generative.user_prompt_template.format(context=<saved
    condition context>, question=<question>)}]; text = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True) with the HF tokenizer at
    the pinned revision; prompt_token_ids = tokenizer.encode(text, add_special_tokens=False)'
  postprocessing: outputs[0].text.strip() only; no sentence trimming
  revision_check: model and tokenizer loaded with revision=<pinned sha> (LLM(model=repo, revision=sha, tokenizer=repo, tokenizer_revision=sha)); resolved commit read
    from the HF cache snapshot path and config._commit_hash; run FAILS if either differs from the pinned sha
  nondeterminism_note: 'vLLM greedy (temperature 0) outputs are NOT guaranteed bit-identical across batch compositions: continuous batching / chunked prefill change
    kernel shapes and floating-point reduction order, which can flip near-tied argmax tokens. The fixed batching policy, fixed submission order and fixed chunking
    above minimise but do not eliminate this; small output differences vs a re-run with a different batch composition are expected and are not protocol deviations.'
