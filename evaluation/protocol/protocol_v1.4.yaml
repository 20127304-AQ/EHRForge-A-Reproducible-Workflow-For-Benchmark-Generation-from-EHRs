changelog_v1_4:
  scope: ONLY the 5 changes below (scoring.llm_judge replaced; new scoring.empty_prediction, scoring.bertscore_logging, scoring.judge_summary, scoring.judge_validation). EM/F1
    definition, BERTScore models/revisions/layers/idf/rescale, bootstrap settings and the fixed 1,000 judge keys are UNCHANGED. The Llama-3.3-70B judge block is kept verbatim
    as history (scoring.llm_judge_v1_3_llama33_70b_history) and is NOT used. All v1.3/v1.2/v1.1 changelogs are kept verbatim.
  changes:
  - id: 1
    title: llm_judge replaced by Prometheus 2 (8x7B) absolute grading
    text: Primary judge prometheus-eval/prometheus-8x7b-v2.0 @ full commit, vLLM own pinned Modal image, bf16, tp=2 on 2 GPUs, official ABSOLUTE prompt + system prompt (prometheus-eval
      0.1.20) with fastchat 'mistral' template, rubric fixed before the pilot, greedy decoding. Clinical context NOT shown to the judge.
    sections:
    - scoring.llm_judge
    - scoring.llm_judge_v1_3_llama33_70b_history
  - id: 2
    title: empty_prediction rule
    text: prediction.strip()=='' -> EM=F1=BERTScore(P,R,F)=0 and judge score 1 without calling the judge or BERTScore; counted and flagged per reader.
    sections:
    - scoring.empty_prediction
  - id: 3
    title: bertscore_logging
    text: per reader and for gold answers, count texts exceeding 512 model tokens (silently truncated) for each BERTScore model; pairs (candidate=prediction, reference=gold)
      sorted by key with asserted alignment; fp32; fixed batch size.
    sections:
    - scoring.bertscore_logging
  - id: 4
    title: judge summary rules
    text: parse integer after LAST '[RESULT]' (valid 1..5), one identical retry for INVALID, then score 1; invalid rate + sensitivity excluding invalids; primary = mean score;
      correct = score>=4 (sensitivity >=3, ==5); full score distribution per run.
    sections:
    - scoring.judge_summary
  - id: 5
    title: judge validation (clinician sheet) + pre-registered decision rule
    text: 'Orchestra instruction 2026-10-04 (Part 5), added BEFORE the pilot and before freezing: ~100 items from the full judge run, stratified by judge score and reader family;
      two blinded clinician columns; agreement statistics with bootstrap CIs; decision rule: binary (score>=4) Cohen''s kappa < 0.6 -> judge reported only as a secondary signal,
      not a headline metric.'
    sections:
    - scoring.judge_validation
  pilot_design:
    fixed_before_pilot: true
    sample: 'about 200 items: 10 strata = reader family {extractive: roberta_base_squad2, biobert_v1_1_pubmed_squad_v2, longformer_squadv2; qwen: qwen2_5_7b, qwen2_5_32b} x
      5 conditions, 20 items per stratum; keys drawn ONLY from dataset keys NOT in judge_keys_1000.csv; rng=numpy.random.default_rng(42); per stratum (fixed order family x
      condition) draw 20 distinct keys among rows with non-empty stripped prediction (empty ones are scored 1 by rule, never sent) and a reader uniformly from the family.'
    probes:
      keys: 50 non-judge keys, rng=numpy.random.default_rng(4242), disjoint from the pilot-sample keys; the SAME 50 items for probes a, c, d (paired)
      a_gold: candidate = gold answer
      b_other_gold: candidate = gold answer of another probe item from a DIFFERENT patient (items sorted by key; donor = next item in a seed-42 permutation whose person_id
        differs)
      c_truncated: candidate = first floor(n_words/3) whitespace words of the gold answer (min 1 word)
      d_gold_plus_filler: candidate = gold answer + ' ' + FILLER
      filler: This summary is based on the documentation available in the patient's clinical notes. It is written in plain language for clarity and reflects the record as it
        was written.
    report: score histogram per reader family, invalid rate, Spearman(score, candidate length in words) within each reader, probe means
    pass_criteria:
      invalid_rate_max: 0.02
      probe_a_mean_min: 4.5
      probe_b_mean_max: 2.0
      probe_d_minus_a_max_exclusive: 0.3
      probe_c_mean_lt_probe_a_mean: true
    on_fail: rubric wording may be revised ONCE (exact change logged here under rubric_revision), pilot rerun on a fresh non-judge sample; second failure -> STOP, no full judge
  rubric_revision: none
  freeze: protocol_v1.4.yaml is FROZEN after a PASS pilot (sha256 written to protocol_v1.4.yaml.sha256) and never changed again
changelog_v1_3:
  scope: 'ADDITIONS ONLY: two new top-level blocks (reader_conditions, generative_engine); reader_conditions also records the user-approved extractive reader substitution
    (change 3). No data, rankings, retrievers, context policy/budget, prompts, decoding values, scoring, judge or bootstrap settings change. The v1.2 (changelog_v1_2)
    and v1.1 (changelog) changelogs are kept verbatim as history.'
  changes:
  - id: 1
    title: reader_conditions
    text: Reader (QA) runs use search_space=full_timeline only for the retrieval conditions bm25, medcpt, nvembed_v2, hybrid_rrf60 (top-5 of the v1.1 full_timeline
      rankings, sha256-verified) plus oracle. sampled_window reader runs are out of scope.
    sections:
    - reader_conditions
  - id: 2
    title: generative_engine
    text: Qwen2.5-7B/32B-Instruct run on vLLM (exact version + own pinned Modal image), bf16, max_model_len 8192, greedy SamplingParams(temperature=0, top_p=1, top_k=-1,
      max_tokens=256, seed=42, n=1), prefix caching off, no speculative decoding, FIXED per-model batching policy, fixed submission order and chunk size; batch-composition
      nondeterminism documented.
    sections:
    - generative_engine
  - id: 3
    title: extractive reader substitution (user-approved)
    text: jon-t/Bio_ClinicalBERT_QA @ 8b7c36d8 failed pre-run check (b) (SQuAD2 F1 10.38 < 40; checkpoint trained on 100 samples / 18 steps) and is replaced by ktrapeznikov/biobert_v1.1_pubmed_squad_v2
      @ 351a8218e59777dcb0a1b454ead77a0c39014bc5 (max_seq_len 512, doc_stride 128). Recorded inside reader_conditions.reader_substitution; the v1.2 readers block
      text is kept verbatim.
    sections:
    - reader_conditions.readers
    - reader_conditions.reader_substitution
  pilot_decision: 'FROZEN after pilot (pre-check d PASS, 25/25 runs, 1,250 rows; results/validation_pilot.json), BEFORE the full run: the proposed batching policy
    is kept UNCHANGED for both models (no memory-driven change needed). qwen2_5_7b: 1x H100 80GB HBM3, tp=1, max_num_seqs=128, max_num_batched_tokens=8192, gpu_memory_utilization=0.90
    (runtime num_gpu_blocks 63836, engine_config_hash bf89509b...). qwen2_5_32b: 2x H100 80GB HBM3, tp=2, max_num_seqs=64, max_num_batched_tokens=8192, gpu_memory_utilization=0.90
    (runtime KV cache 319,520 tokens, num_gpu_blocks 19970, engine_config_hash 9ec3813a...). Observed runtime facts of the pinned engine (recorded, not changed):
    vLLM 0.28.0 normalises SamplingParams top_k=-1 to top_k=0 (both = disabled; sampling_type GREEDY); async_scheduling=True (engine default, constant for all conditions);
    compilation mode VLLM_COMPILE with CUDA graphs FULL_AND_PIECEWISE (enforce_eager=False). Transformers DISABLE_SAFETENSORS_CONVERSION=1 set in both images so only
    the pinned snapshot is fetched.'
changelog_v1_2:
  scope: exactly the 2 user-approved wording changes below; no data, rankings, retrievers, readers, prompts, scoring or bootstrap settings change. The v1.1 changelog (key `changelog`) is kept verbatim as history.
  changes:
  - id: 1
    title: sampled_window order invariant (BM25 window index)
    text: 'retrieval_output.invariants sampled_window entry replaced by the text approved from agent_step1_protocol_v1_1_full_depth_retriever_72af8248_workdir/draft_protocol_amendment_bm25_window_invariant.md: the restricted-order relation is required only for medcpt and nvembed_v2; bm25@sampled_window uses its own window-only BM25Okapi index (v1.1 change 2); hybrid_rrf60@sampled_window is recomputed from the sampled_window bm25 and medcpt ranks. Wording only: the v1.1 rankings already satisfy it.'
    sections: [retrieval_output.invariants]
  - id: 2
    title: retrieval_metrics definitions (Hit/Recall/Coverage naming, closed-form random baselines)
    text: 'retrieval_metrics block replaced: Hit@k = 1 if any gold visit in top-k; Recall@k = |gold ∩ top-k|/|gold|; Coverage@k = 1 if all gold visits in top-k; k in {5,10,20}; MRR = 1/rank of first gold over the full ranking; last_gold_rank; exact closed-form per-question random baselines (Hit, Recall, Coverage, MRR, last_gold_rank). Resolves the v1.1 open item deferring retrieval metric naming to Step 2.'
    sections: [retrieval_metrics]
changelog:
  scope: exactly the 5 user-approved changes below; everything else (readers, context budget 3500 Qwen tokens, prompts, decoding, scoring, judge, bootstrap, metric definitions) is byte-identical to v1.0-step0
  changes:
  - id: 1
    title: BM25 tokenizer
    text: 'BM25 tokenizer = lambda s: re.sub(r''[^\w\s]'', '' '', s.lower()).split(). The same tokenizer is applied to queries and documents. BM25Okapi params unchanged (k1=1.5, b=0.75, epsilon=0.25).'
    sections: [retrievers.bm25.tokenizer, retrievers.bm25.tokenizer_note]
  - id: 2
    title: sampled_window ranking
    text: 'sampled_window BM25 builds its own BM25Okapi index (and therefore its IDF) over ONLY the window''s visits (window from shared/canonical/sampled_window.py); one cached index per (person_id, timeline_sampling_strategy). For MedCPT and NV-Embed-v2 the sampled_window ranking = full-timeline scores restricted to window candidates (dense query-document scores do not depend on other documents, so this is exact). hybrid_rrf60@sampled_window is recomputed from the sampled_window BM25 and MedCPT ranks. v1.0''s sampled_window.ranking text is replaced accordingly.'
    sections: [search_spaces.sampled_window.ranking, retrievers.bm25.index_sampled_window]
  - id: 3
    title: NV-Embed-v2 own Modal image
    text: 'nvidia/NV-Embed-v2 @ 3fa59658547db50a1e8e3346cf057fd0c77ed6ef runs in its OWN Modal image with transformers pinned to 4.42.4, using the official model.encode() with its native latent-attention pooling, the v1.0 query instruction, empty passage instruction, max_length 4096, L2-normalised, cosine. Never fall back to another model (e.g. e5); fail loudly instead. transformers/torch/sentence-transformers versions of BOTH images (NV-Embed image and main image) are recorded here and in run metadata.'
    sections: [retrievers.nvembed_v2.runtime_image, retrievers.nvembed_v2.encode, retrievers.nvembed_v2.fallback, software_versions.modal_images_v1_1]
  - id: 4
    title: hybrid_rrf renamed hybrid_rrf60; rebuild + forbidden-input clause
    text: 'hybrid_rrf renamed to hybrid_rrf60 everywhere (retrievers, conditions, condition ids). hybrid_rrf60 is rebuilt from the NEW full-depth BM25 and MedCPT rankings produced under protocol 1.1, for the same search_space, referenced by file path + sha256 in the run metadata and in each header''s inputs_source field. retrieval_results_p2_top20.json and every file under archive/pre_fix/ are FORBIDDEN as inputs. k=60, score = sum_r 1/(60+rank_r) and the v1.0 tie-break are unchanged.'
    sections: [retrievers.hybrid_rrf60, conditions]
  - id: 5
    title: Output schemas adopted verbatim
    text: 'Draft schemas from agent_step1_preflight_read_only_b7d4e1e3_workdir/draft_protocol_v1.1_schema.yaml adopted VERBATIM as sections retrieval_output (question_header + ranked_row + invariants) and context_metadata (fields + invariants), with retriever enum [bm25, medcpt, nvembed_v2, hybrid_rrf60], plus the conventions block (visit_id = original_visit_index; corpus_n_visits_canonical 170827; required_run_metadata).'
    sections: [conventions, retrieval_output, context_metadata]
  open_items:
  - 'Retrieval metric definitions (Hit/Recall/Coverage naming) are DEFERRED to Step 2; retrieval_metrics is unchanged from v1.0 in this version.'
  - 'Paper Table 1 reports 170,847 visits; canonical corpus count is 170,827 (conventions.corpus_n_visits_canonical). The 20-visit discrepancy is an author item, not a blocker.'
  - 'The verbatim-adopted invariant text ''retrievers.tie_break / hybrid_rrf.tie_break'' refers to retrievers.hybrid_rrf60.tie_break after the change-4 rename (wording kept verbatim per change 5).'
  - 'NV-Embed-v2 numeric dtype is not specified by the protocol (unchanged). The Step-1 smoke test loaded the model with the from_pretrained default (torch.float32); runs must record the dtype in run metadata. Pinning a dtype would require a new approved change.'
  - 'data/corpus.json was found missing at the start of Step 1 and was restored (user-approved) from the v1.0 corpus.source by gdown; sha256 b77d4b75...d0a2 and size 162124534 verified byte-exact before use. No protocol content changed.'
