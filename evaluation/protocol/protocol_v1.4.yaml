  empty_prediction:
    rule: a prediction that is empty after str.strip() scores 0 on EM, token F1 and BERTScore (P, R, F1; both models) and 1 on the judge, WITHOUT calling the judge or BERTScore
    flags: per-row empty_prediction flag; judge_called=false for these rows; counted per reader and per (reader, condition)
    applies_to: 'exact empty strings and whitespace-only predictions (Step 3: 2 exact-empty extractive outputs, plus whitespace-only extractive spans)'
  bertscore_logging:
    truncation_count: for each BERTScore model, count texts whose token length (model tokenizer, add_special_tokens=True, as encoded by bert_score.utils.sent_encode WITHOUT truncation)
      exceeds 512, per reader (predictions, per condition) and for the gold answers; such texts are silently truncated to 512 by bert_score
    max_length: tokenizer.model_max_length set to 512 for both models (Bio_ClinicalBERT ships no model_max_length)
    pair_order: cands = predictions, refs = gold answers; rows sorted by (person_id, qa_index) within each (reader, condition); alignment asserted (key arrays equal between prediction
      and gold frames)
    precision: 'fp32 (TF32 disabled: torch.backends.cuda.matmul.allow_tf32=False, cudnn.allow_tf32=False)'
    batch_size: 64
    implementation: bert_score 0.3.13 BERTScorer(model_type=<local snapshot at pinned sha>, num_layers=<17|9>, idf=False, rescale_with_baseline=False)
  judge_summary:
    parse: 'integer after the LAST ''[RESULT]'' in the raw output: the first numeric token after it must be an integer in 1..5 (e.g. ''4'', ''(4)''); otherwise INVALID (no ''[RESULT]'',
      non-integer such as 4.5, out of range)'
    retry: INVALID outputs are retried ONCE with identical prompt and sampling settings; if still INVALID the score is 1 (invalid flag kept)
    stored_per_row:
    - raw_feedback
    - raw_feedback_retry
    - score
    - invalid_first
    - invalid_final
    - retried
    - judge_called
    - empty_prediction
    - n_prompt_tokens
    - n_output_tokens
    - finish_reason
    primary_metric: mean score (1-5) over the 1,000 judge keys
    derived_binary:
      correct: score >= 4
      sensitivity_lenient: score >= 3
      sensitivity_strict: score == 5
    report:
    - invalid rate per run (first attempt and final)
    - sensitivity analysis excluding final-INVALID rows
    - full score distribution 1..5 per run
  judge_validation:
    sheet: 'shared/scoring_v1.4/clinician_validation_100.xlsx: about 100 items drawn from the FULL judge run (1,000 judge keys x 25 runs, judge_called rows), stratified by judge
      score (about 20 per level 1..5, or as close as possible) and reader family (extractive vs qwen), numpy.random.default_rng(42); columns item_id, question, gold answer, candidate
      answer, rubric text, EMPTY clinician1_score (1-5) and clinician2_score (1-5)'
    blinding: judge score, reader and condition are NOT in the sheet; they are kept in a separate key file clinician_validation_100_key.csv
    analysis: 'analyze_clinician_agreement.py: quadratic-weighted kappa and Spearman rho (1-5 scale) judge vs each clinician; Cohen''s kappa and accuracy on binary score>=4;
      inter-clinician kappa if both columns filled; bootstrap 95% percentile CIs (1000 resamples, default_rng(42)) for all'
    decision_rule: 'PRE-REGISTERED: if the binary (score>=4) Cohen''s kappa between judge and clinician labels is < 0.6, the LLM judge is reported only as a SECONDARY signal,
      not as a headline metric'
  bootstrap:
    n_resamples: 1000
    seed: 42
    ci: 95% percentile
    indices: rng=numpy.random.default_rng(42); idx=rng.integers(0, n, size=(1000, n)) over keys sorted by (person_id, qa_index); the SAME idx matrix for every condition/reader (paired)
    separate_matrices:
      full: 10742
      judge_subset: 1000
retrieval_metrics:
  version: '1.2 (Step 2): replaces the v1.0/v1.1 retrieval_metrics block'
  per_search_space: true
  gold: evidence_mapping.gold_set (sorted, deduplicated original_visit_index; reference shared/canonical/ehr_data.py:gold_visits)
  k:
  - 5
  - 10
  - 20
  top_k: first min(k, N) entries of the FULL ranking of the condition (all N candidates when k >= N); N = header n_candidates
  hit_at_k:
    k:
    - 5
    - 10
    - 20
    def: 1 if any gold visit in top_k else 0
  recall_at_k:
    k:
    - 5
    - 10
    - 20
    def: '|gold ∩ top_k| / |gold|'
  coverage_at_k:
    k:
    - 5
    - 10
    - 20
    def: 1 if all gold visits in top_k (gold ⊆ top_k) else 0
  mrr: 1 / rank of first gold visit in the FULL ranking (1-based)
  last_gold_rank: max rank of any gold visit in the FULL ranking (= smallest k achieving coverage)
  strata:
    candidate_count_N:
    - <=10
    - 11-30
    - 31-100
    - 101-300
    - '>300'
    n_gold_visits:
    - '1'
    - '2'
    - '>=3'
    visit_group: dataset column
    reasoning_type: dataset column
    difficulty: dataset column
  random_baseline:
    type: exact closed form per question given N candidates and G gold visits, then averaged identically to the metric (no simulation); k_eff = min(k, N)
    hit_at_k: 1 - C(N-G, k_eff) / C(N, k_eff)
    recall_at_k: min(k, N) / N
    coverage_at_k: C(N-G, k_eff-G) / C(N, k_eff) for k_eff >= G else 0
    mrr: 'expected reciprocal of the minimum rank of G uniformly random gold positions among N, computed exactly: sum_{r=1}^{N-G+1} (1/r) * C(N-r, G-1) / C(N, G)'
    last_gold_rank: G (N+1) / (G+1)
