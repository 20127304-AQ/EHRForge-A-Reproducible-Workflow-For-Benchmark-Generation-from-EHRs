# EHRForge canonical evaluation protocol - FROZEN at Step 0. Generated by agent_step0_protocol_freeze_e3f56aca_workdir/code/part_c_protocol.py
protocol_version: 1.0-step0
frozen_by: agent_step0_protocol_freeze_e3f56aca_workdir
rule: All later steps MUST read this file and assert dataset/corpus/judge_keys sha256 before running. Any deviation must bump protocol_version.
seed: 42
dataset:
  path: data/dataset.csv
  sha256: 66a968330bea85bef75f847a6a0c4e8bb8352e0ac363c85c75436b0ee034847f
  n_rows: 10742
  n_patients: 829
  key:
  - person_id
  - qa_index
  evidence_column: evidence
  evidence_snippet_field: evidence_snippet
  n_evidence_items: 24141
corpus:
  path: data/corpus.json
  format: 'jsonl: {person_id, visits:[{visit_datetime, text}]}'
  sha256: b77d4b75ff4a8bd6ce8c9138a718ae04c0d76bf3066218b762a2c887d1a5d0a2
  size_bytes: 162124534
  n_patients: 961
  n_visits_total: 170827
  source: gdown https://drive.google.com/uc?id=1pylEkXTZH2i61ZLlrQPkHanz28e24ysF
  visit_order: visits already chronological for all patients (verified); list position == full-timeline index
evidence_mapping:
  field: original_visit_index
  never_use: visit_index
  verify_datetime: assert corpus[pid].visits[original_visit_index].visit_datetime == evidence.visit_datetime, raise on mismatch
  deduplicate: true
  sort: chronological (ascending original_visit_index == ascending visit_datetime)
  out_of_range: raise
  gold_set: sorted set of original_visit_index per (person_id, qa_index)
  step0_verification:
    datetime_match_original_visit_index_pct: 100.0
    datetime_match_visit_index_pct: 16.56
    out_of_range_original_visit_index: 0
    out_of_range_visit_index: 0
    snippet_exact_substring_pct: 35.77
    snippet_normalized_match_pct: 99.47
search_spaces:
  list:
  - full_timeline
  - sampled_window
  full_timeline: all visits of the patient; candidate count N = len(visits)
  sampled_window:
    definition: visits of the QA's timeline_sampling_strategy window; reference implementation shared/canonical/sampled_window.py
    rules:
      local_chunk_{a}_{b}_size_{s}_overlap_{o}: range(a, min(b, V))
      '[global_]u_shape_first_{f}_last_{l}': range(f) + range(V-l, V); all visits if f+l >= V
      full_timeline_{lo}_{hi}: range(V)
    ranking: full_timeline ranking (scores computed over full timeline, incl. BM25 IDF) restricted to window candidates, order preserved; hybrid_rrf recomputed from restricted ranks
    step0_validation: 24141/24141 gold original_visit_index inside window and position == visit_index
    window_size:
      count: 10742.0
      mean: 28.4
      std: 5.0
      min: 2.0
      25%: 30.0
      50%: 30.0
      75%: 30.0
      max: 30.0
retrievers:
  document_unit: one visit (visit text only; datetime not included in the document)
  query: question text
  tie_break: score descending, then visit index ascending (stable)
  output: FULL ranking of all N candidates with scores, stored per (person_id, qa_index) in full-timeline indices
  bm25:
    impl: rank_bm25.BM25Okapi
    params:
      k1: 1.5
      b: 0.75
      epsilon: 0.25
    index: one BM25Okapi per patient over all visits of that patient
    tokenizer: 'lambda s: s.lower().split()'
    tokenizer_note: str.lower() then str.split() with no args (split on any whitespace run); NO punctuation stripping. Old scripts used re.sub(r'[^\w\s]',' ',s.lower()).split() - intentionally not used.
  medcpt:
    query_encoder:
      repo: ncbi/MedCPT-Query-Encoder
      sha: d83a36cc6b8e3a5c5e9d9d6ba156808c1643dcbc
      max_length: 64
    article_encoder:
      repo: ncbi/MedCPT-Article-Encoder
      sha: d05a736da4bb84ee4057b7f7999485be6ed85465
      max_length: 512
      input: '[['''', visit_text]] (empty title)'
    pooling: CLS (last_hidden_state[:,0])
    similarity: dot product
    truncation: log number of truncated visits
  nvembed_v2:
    repo: nvidia/NV-Embed-v2
    sha: 3fa59658547db50a1e8e3346cf057fd0c77ed6ef
    query_instruction: 'Instruct: Given a clinical question, retrieve patient visit notes that answer the question

      Query: '
    passage_instruction: ''
    max_length: 4096
    normalize: true
    similarity: cosine
    trust_remote_code: true
  hybrid_rrf:
    inputs:
    - bm25
    - medcpt
    k: 60
    depth: FULL rankings (all N candidates)
    score: sum_r 1/(60 + rank_r(d)), rank 1-based
    tie_break: min(rank_bm25, rank_medcpt) ascending, then visit index ascending
conditions:
- bm25
- medcpt
- nvembed_v2
- hybrid_rrf
- oracle
condition_id_format: '{retriever}@{search_space} for retrieval conditions (e.g. bm25@full_timeline); ''oracle'' for oracle'
oracle:
  context_visits: ALL deduplicated gold original_visit_index visits (not capped at reader_top_k)
  note: 20 QAs have >5 gold visits (max 10); same context_budget applies
  gold_count_distribution:
    1: 2132
    2: 6713
    3: 1476
    4: 336
    5: 65
    6: 13
    7: 6
    10: 1
context:
  reader_top_k: 5
  order: chronological (ascending full-timeline index), NOT rank order
  header_format: === VISIT {idx} | {datetime} ===
  header_idx: full-timeline index (original_visit_index space)
  block_format: '{header}

    {text}'
  block_separator: '


    '
  same_context_for_all_readers: true
context_budget:
  max_tokens: 3500
  tokenizer:
    repo: Qwen/Qwen2.5-7B-Instruct
    sha: a09a35458c702b33eeacc393d103063234e8bc28
    files_only: tokenizer files only (no weights)
  measured_on: the full assembled context string (headers + texts + separators), add_special_tokens=False
  over_budget_policy: keep every header; available = 3500 - tokens(headers+separators); each visit text i keeps floor(len_i * available / sum_j len_j) tokens from its START (trimmed from its end); decode
    kept tokens
  log: 'per (person_id, qa_index, condition): n_visits, original token count per visit, surviving token count per visit, trimmed flag'
readers:
  extractive:
    roberta_base_squad2:
      repo: deepset/roberta-base-squad2
      sha: adc3b06f79f797d1c575d5479d6f5efe54a9e3b4
      max_seq_len: 512
      doc_stride: 128
    bio_clinicalbert_qa:
      repo: jon-t/Bio_ClinicalBERT_QA
      sha: 8b7c36d8a85cd23e9e1e552eea2857dc35224857
      max_seq_len: 512
      doc_stride: 128
    longformer_squadv2:
      repo: mrm8488/longformer-base-4096-finetuned-squadv2
      sha: e8039dc570012c25410a22131f83a77edfea3ed4
      max_seq_len: 4096
      doc_stride: 128
    decoding:
      max_answer_len_tokens: 64
      handle_impossible_answer: false
      span_selection: highest start+end logit over all stride windows
  generative:
    qwen2_5_7b:
      repo: Qwen/Qwen2.5-7B-Instruct
      sha: a09a35458c702b33eeacc393d103063234e8bc28
    qwen2_5_32b:
      repo: Qwen/Qwen2.5-32B-Instruct
      sha: 5ede1c97bbab6ce5cda5812749b4c0bdf79b18dd
    dtype: bfloat16
    chat_template: tokenizer.apply_chat_template(messages, add_generation_prompt=True)
    system_prompt: You are a clinical assistant. Answer the question based strictly on the provided patient visit notes. Be concise and answer in 1-3 sentences.
    user_prompt_template: 'Patient Visit Notes:

      {context}


      Question: {question}'
    decoding:
      temperature: 0.0
      do_sample: false
      top_p: 1.0
      max_new_tokens: 256
      seed: 42
    postprocessing: strip() only; NO post-hoc sentence trimming
    same_settings_for_7b_and_32b: true
scoring:
  token_f1_em:
    normalization: 'SQuAD v1.1 normalize_answer: lowercase, remove punctuation, remove articles (a|an|the), collapse whitespace'
    reference: single gold answer column 'answer'
    empty_prediction: scores 0
  bertscore:
    primary:
      model_type: roberta-large
      repo: FacebookAI/roberta-large
      sha: 722cf37b1afa9454edce342e7895e588b6ff1d59
      num_layers: 17
      idf: false
      rescale_with_baseline: false
    secondary:
      model_type: emilyalsentzer/Bio_ClinicalBERT
      sha: d5892b39a4adaed74b92212a44081509db72f87b
      num_layers: 9
      idf: false
      rescale_with_baseline: false
    report: F1 (P and R stored)
  llm_judge:
    repo: meta-llama/Llama-3.3-70B-Instruct
    sha: 6f6073b423013f6a7d4d9f39144961bfbfbc386b
    serving: HF weights at pinned sha, bf16 (NOT a quantized Ollama build)
    gated: true
    system_prompt: You are an expert clinical evaluator. You compare a predicted answer with a gold reference answer.
    user_prompt_template: 'Question: {question}

      Gold Answer: {gold_answer}

      Predicted Answer: {prediction}


      Does the predicted answer correctly capture the clinical meaning of the gold answer? Output exactly YES or NO.'
    decoding:
      temperature: 0.0
      max_new_tokens: 4
    parse: strip().upper(); startswith YES -> 1, startswith NO -> 0, else INVALID (logged, counted as 0)
    subset:
      path: shared/canonical/judge_keys_1000.csv
      sha256: 0aab500b691b2102fc80f96ea937a3e8e1f2abd3772d1a4c4d149d729c3d8fd0
      n: 1000
  bootstrap:
    n_resamples: 1000
    seed: 42
    ci: 95% percentile
    indices: rng=numpy.random.default_rng(42); idx=rng.integers(0, n, size=(1000, n)) over keys sorted by (person_id, qa_index); the SAME idx matrix for every condition/reader (paired)
    separate_matrices:
      full: 10742
      judge_subset: 1000
retrieval_metrics:
  per_search_space: true
  gold: evidence_mapping.gold_set
  recall_at_k:
    k:
    - 5
    - 10
    - 20
    def: '|gold ∩ top_k| / |gold|'
  coverage_at_k:
    k:
    - 5
    - 10
    - 20
    def: 1 if gold ⊆ top_k else 0
  mrr: 1 / rank of first gold in the FULL ranking (1-based)
  last_gold_rank: max rank of any gold visit in the FULL ranking (= smallest k achieving coverage)
  strata:
    candidate_count_N:
    - <=10
    - 11-30
    - 31-100
    - 101-300
    - '>300'
    n_gold_visits:
    - '1'
    - '2'
    - '>=3'
    visit_group: dataset column
    reasoning_type: dataset column
  random_baseline:
    type: exact closed form per question, then averaged (no simulation)
    recall_at_k: min(k, N) / N
    coverage_at_k: C(N-G, k-G) / C(N, k) for k >= G else 0 (1 if k >= N)
    mrr: sum_{r=1}^{N-G+1} (1/r) * C(N-r, G-1) / C(N, G)
    last_gold_rank: G (N+1) / (G+1)
resume_key:
- person_id
- qa_index
- reader
- condition
software_versions:
  recorded_in: Step-0 CPU env (later GPU steps must log their runtime versions in run metadata)
  python: 3.11.16
  pandas: 3.0.6
  numpy: 2.4.6
  transformers: NOT_INSTALLED_IN_STEP0_CPU_ENV
  rank_bm25: 0.2.2
  bert-score: NOT_INSTALLED_IN_STEP0_CPU_ENV
  huggingface_hub: 2.1.1
  pyyaml: 6.0.3
  pypi_latest_at_freeze_reference:
    transformers: 5.18.0
    bert-score: 0.3.13
    rank-bm25: 0.2.2
