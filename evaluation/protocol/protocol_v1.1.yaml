# ===========================================================================
# v1.1 change 5: adopted VERBATIM from agent_step1_preflight_read_only_b7d4e1e3_workdir/draft_protocol_v1.1_schema.yaml (lines 7-110)
# ===========================================================================
conventions:
  visit_id: original_visit_index        # 0-based position in data/corpus.json person's visits list (full-timeline space). NEVER visit_index.
  corpus_n_visits_canonical: 170827     # data/corpus.json sha b77d4b75…d0a2; paper Table 1 value 170,847 is NOT used
  datetime_format: "YYYY-MM-DD HH:MM:SS"  # the only format present in corpus.json (170,827/170,827); copied verbatim as string
  id_list_encoding: JSON array of int, sorted ascending, no duplicates   # e.g. "[12, 40, 41]"
  file_format: parquet (preferred) or JSONL; one file per (retriever, search_space) for retrieval; one per (reader, condition) for context metadata
  required_run_metadata: [protocol_version, protocol_sha256, dataset_sha256, corpus_sha256, git/code sha, library versions, model repo+sha, created_utc]

# ---------------------------------------------------------------------------
# (i) RETRIEVAL OUTPUT  (Check 2)
# ---------------------------------------------------------------------------
retrieval_output:
  question_header:            # one row per (person_id, qa_index, retriever, search_space)
    primary_key: [person_id, qa_index, retriever, search_space]
    fields:
      person_id:        {type: int64, nullable: false}
      qa_index:         {type: int64, nullable: false}
      retriever:        {type: str, enum: [bm25, medcpt, nvembed_v2, hybrid_rrf60], nullable: false}
      search_space:     {type: str, enum: [full_timeline, sampled_window], nullable: false}
      timeline_sampling_strategy: {type: str, nullable: false, note: "copied from dataset.csv; used by shared/canonical/sampled_window.window()"}
      n_visits_patient: {type: int32, nullable: false, note: "len(corpus[person_id].visits)"}
      n_candidates:     {type: int32, nullable: false, note: "N. full_timeline: n_visits_patient; sampled_window: len(window(strategy, n_visits_patient))"}
      candidate_visit_ids: {type: "list<int32>", nullable: false, note: "sorted ascending; full_timeline = range(N); sampled_window = window(strategy, V)"}
      gold_visit_ids:   {type: "list<int32>", nullable: false, note: "evidence_mapping.gold_set (sorted, deduplicated original_visit_index)"}
      n_gold_visits:    {type: int16, nullable: false}
      ranking_depth:    {type: int32, nullable: false, note: "number of ranked rows written; MUST equal n_candidates"}
      score_native:     {type: bool, nullable: false, note: "true for bm25/medcpt/nvembed_v2 (native score), true for hybrid_rrf60 (RRF score)"}
      inputs_source:    {type: str, nullable: true, note: "hybrid_rrf60 only: identifiers (file path + sha256) of the NEW full-depth bm25 and medcpt rankings of the same search_space. Must NOT reference retrieval_results_p2_top20.json or any archive/pre_fix file"}
  ranked_row:                 # one row per ranked candidate visit
    primary_key: [person_id, qa_index, retriever, search_space, rank]
    alternate_unique_key: [person_id, qa_index, retriever, search_space, original_visit_index]
    fields:
      person_id:            {type: int64, nullable: false}
      qa_index:             {type: int64, nullable: false}
      retriever:            {type: str, enum: [bm25, medcpt, nvembed_v2, hybrid_rrf60], nullable: false}
      search_space:         {type: str, enum: [full_timeline, sampled_window], nullable: false}
      original_visit_index: {type: int32, nullable: false, note: "full-timeline index even for sampled_window"}
      visit_datetime:       {type: str, nullable: false, note: "verbatim corpus string"}
      rank:                 {type: int32, nullable: false, note: "1-based within this search space"}
      score:                {type: float64, nullable: true, note: "null ONLY if retriever has no native score (none of the four v1.0 retrievers qualifies). hybrid_rrf60: sum_r 1/(60+rank_r) with rank_r from the SAME search_space's bm25/medcpt rankings"}
      is_gold:              {type: bool, nullable: false, note: "original_visit_index in gold_visit_ids (convenience; derivable)"}
  invariants:
    - "header primary key unique; exactly one header per dataset row (10,742) per (retriever, search_space)"
    - "ranked_row primary key and alternate_unique_key are unique"
    - "for each header: count(ranked_row) == ranking_depth == n_candidates"
    - "ranks are exactly {1..N} (contiguous, no gaps, no duplicates)"
    - "set(original_visit_index over ranked rows) == set(candidate_visit_ids)"
    - "0 <= original_visit_index < n_visits_patient"
    - "visit_datetime == corpus[person_id].visits[original_visit_index].visit_datetime (string equality); raise on mismatch"
    - "score non-increasing in rank; ties broken per protocol retrievers.tie_break / hybrid_rrf.tie_break"
    - "sampled_window: relative order of candidates equals their order in the full_timeline ranking of the same retriever (bm25/medcpt/nvembed_v2); hybrid_rrf60 recomputed from restricted ranks"
    - "gold_visit_ids subset of candidate_visit_ids (Step 0: 24,141/24,141 inside window); n_gold_visits == len(gold_visit_ids) >= 1"
    - "hybrid_rrf60: k == 60; inputs are the full-depth (ranking_depth == N) bm25 and medcpt rankings produced under this protocol version; NEVER the pre-fix top-20 file"

# ---------------------------------------------------------------------------
# (ii) CONTEXT METADATA  (Check 4)
# ---------------------------------------------------------------------------
context_metadata:
  primary_key: [person_id, qa_index, reader, condition]   # == protocol resume_key
  fields:
    person_id:                {type: int64, nullable: false}
    qa_index:                 {type: int64, nullable: false}
    reader:                   {type: str, enum: [roberta_base_squad2, bio_clinicalbert_qa, longformer_squadv2, qwen2_5_7b, qwen2_5_32b], nullable: false}
    condition:                {type: str, nullable: false, note: "'{retriever}@{search_space}' or 'oracle' (protocol condition_id_format)"}
    n_gold_visits:            {type: int16, nullable: false}
    gold_visit_ids:           {type: "list<int32>", nullable: false}
    n_selected_visits:        {type: int16, nullable: false, note: "retrieval: min(reader_top_k=5, N); oracle: n_gold_visits"}
    selected_visit_ids:       {type: "list<int32>", nullable: false, note: "sorted ascending (chronological context order)"}
    n_visits_reaching_model:  {type: int16, nullable: false, note: "selected visits with >=1 surviving text token after budgeting AND (extractive) present in >=1 window"}
    visit_ids_reaching_model: {type: "list<int32>", nullable: false}
    total_tokens_before:      {type: int32, nullable: false, note: "full assembled context (headers+texts+separators), add_special_tokens=False, budget tokenizer"}
    total_tokens_after:       {type: int32, nullable: false}
    per_visit_tokens_before:  {type: "list<int32>", nullable: false, note: "text-only tokens, aligned with selected_visit_ids"}
    per_visit_tokens_after:   {type: "list<int32>", nullable: false, note: "aligned with selected_visit_ids"}
    header_separator_tokens:  {type: int32, nullable: false}
    truncated:                {type: bool, nullable: false, note: "total_tokens_before > budget_tokens"}
    n_gold_visits_surviving:  {type: int16, nullable: false, note: "gold visits in visit_ids_reaching_model"}
    gold_fully_survived:      {type: bool, nullable: false, note: "all gold visits selected AND untrimmed (per_visit_tokens_after == before)"}
    gold_tokens_before:       {type: int32, nullable: false}
    gold_tokens_after:        {type: int32, nullable: false}
    budget_tokens:            {type: int32, nullable: false, const: 3500}
    tokenizer_name:           {type: str, nullable: false, const: Qwen/Qwen2.5-7B-Instruct}
    tokenizer_revision:       {type: str, nullable: false, const: a09a35458c702b33eeacc393d103063234e8bc28}
    reader_tokenizer_name:    {type: str, nullable: false, note: "reader's own tokenizer repo"}
    reader_tokenizer_revision: {type: str, nullable: false}
    reader_input_tokens:      {type: int32, nullable: true, note: "generative: prompt tokens after chat template"}
    n_windows:                {type: int16, nullable: true, note: "extractive readers only (null for generative)"}
    window_stride:            {type: int16, nullable: true, note: "extractive only: doc_stride (128)"}
    max_seq_len:              {type: int16, nullable: true, note: "extractive only: 512 or 4096"}
    context_sha256:           {type: str, nullable: false, note: "sha256 of exact UTF-8 context string passed to reader"}
  invariants:
    - "primary key unique; for every (reader, condition) exactly 10,742 rows"
    - "oracle: selected_visit_ids == gold_visit_ids (set and order) and n_selected_visits == n_gold_visits"
    - "retrieval conditions: selected_visit_ids == sorted(top-min(5,N) of the condition's ranking)"
    - "n_visits_reaching_model <= n_selected_visits; visit_ids_reaching_model subset of selected_visit_ids"
    - "n_gold_visits_surviving <= min(n_gold_visits, n_visits_reaching_model)"
    - "gold_fully_survived implies n_gold_visits_surviving == n_gold_visits"
    - "total_tokens_after <= budget_tokens"
    - "truncated == (total_tokens_before > budget_tokens); if not truncated: per_visit_tokens_after == per_visit_tokens_before"
    - "len(per_visit_tokens_before) == len(per_visit_tokens_after) == n_selected_visits"
    - "per_visit_tokens_after[i] <= per_visit_tokens_before[i]"
    - "same_context_for_all_readers: context_sha256 identical across readers for the same (person_id, qa_index, condition)"
    - "extractive readers: n_windows >= 1 and window_stride == 128; generative: n_windows is null"
