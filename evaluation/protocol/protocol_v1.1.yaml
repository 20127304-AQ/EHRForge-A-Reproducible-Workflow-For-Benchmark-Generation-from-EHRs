    rebuild: 'hybrid_rrf60 is rebuilt from the NEW full-depth BM25 and MedCPT rankings produced under protocol 1.1, for the same search_space, referenced by file path + sha256 in the run metadata and in each header''s inputs_source field.'
    forbidden_inputs: 'retrieval_results_p2_top20.json and every file under archive/pre_fix/ are FORBIDDEN as inputs.'
