  - id: 1
    title: BM25 tokenizer
    text: 'BM25 tokenizer = lambda s: re.sub(r''[^\w\s]'', '' '', s.lower()).split(). The same tokenizer is applied to queries and documents. BM25Okapi params unchanged (k1=1.5, b=0.75, epsilon=0.25).'
